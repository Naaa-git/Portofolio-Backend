name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Stage 1 (Fowler's "commit build"): fast, uses fakes (FakeEmailSender,
  # FakeOtpEmailProducer, etc.), no external services. Target under 10
  # minutes — this is what gives fast feedback on every push.
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Caches ~/.nuget/packages, keyed by the lockfile's hash — a run with
      # the same dependencies skips re-downloading every NuGet package.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # Stage 2 (Fowler's "secondary build"): slower, hits real Postgres and
  # OpenSearch — the two dependencies Program.cs touches unconditionally
  # before the server can accept any request (DB migration + full reindex).
  # Unit tests above run entirely against fakes and never actually start
  # the app, so they can't catch a broken startup path on their own; this
  # proves the real published app boots against real services and serves
  # a request. Only runs if the fast stage already passed.
  smoke-test:
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portofolio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
        ports:
          - 9200:9200

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Kafka is deliberately not spun up here: confirmed locally that the
      # app stays up and /health still responds without a broker (librdkafka
      # just retries in the background) — it isn't a startup dependency, so
      # adding it would only slow this stage down for no extra coverage.
      - name: Smoke test the built server
        working-directory: Portfolio.Api
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=portofolio;Username=postgres;Password=postgres"
          Jwt__SigningKey: "ci-smoke-test-signing-key-at-least-32-characters"
          OpenSearch__Url: "http://localhost:9200"
          SeedAdmin__Username: "ci-admin"
          SeedAdmin__Password: "ci-smoke-test-password"
          SeedAdmin__Email: "ci@example.com"
        run: |
          dotnet run --no-build --configuration Release &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5229/health > /dev/null; then
              echo "Server responded successfully."
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done
          echo "Server did not respond in time."
          kill $SERVER_PID
          exit 1

  # Stage 3: publish the tested image. Only runs when a `v*` tag is pushed —
  # a deliberate release action, not every merge to main. This is Continuous
  # Delivery (always deployable, a human decides when) rather than full
  # Continuous Deployment (every merge ships automatically) — chosen so
  # releases can be held, batched, and timed on purpose.
  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged with the release version itself (e.g. v1.2.0) — human-
      # readable and exactly what the VPS's docker-compose.yml pins to, so
      # "what's running in production" is always an explicit, visible
      # version, not an implicit "whatever `latest` happened to be". Also
      # tagged `latest` for convenience (local testing, quick pulls) — the
      # VPS itself never relies on it.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./Portfolio.Api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-api:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-api:latest

  # Stage 4: deploy. Writes api.env fresh from GitHub Secrets every time —
  # the VPS copy is never hand-edited, GitHub Secrets is the only source of
  # truth, so there's no drift between "what we think is configured" and
  # what's actually running. Only touches the `api` service — infra
  # (postgres, kafka, opensearch, grafana, etc.) and `frontend` are untouched,
  # so this can't race with the frontend repo's own deploy.
  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker-compose.prod.yml and monitoring/ are plain text, no secrets —
      # safe to sync automatically every deploy. infra.env is NOT included
      # here on purpose: it holds real secrets (Postgres password, Grafana
      # SMTP creds) that backend has no reason to own or duplicate as its
      # own GitHub Secrets — that one stays manual, set up once.
      - name: Sync compose file and monitoring config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,monitoring/"
          target: "~/portfolio/"
          strip_components: 0

      - name: Write api.env and restart the api service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cat > ~/portfolio/api.env << 'ENVEOF'
            ConnectionStrings__Default=Host=postgres;Port=5432;Database=portofolio;Username=postgres;Password=${{ secrets.POSTGRES_PASSWORD }}
            Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}
            Jwt__Issuer=portofolio-api
            Jwt__Audience=portofolio-admin
            Google__ClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            Microsoft__ClientId=${{ secrets.MICROSOFT_CLIENT_ID }}
            Brevo__ApiKey=${{ secrets.BREVO_API_KEY }}
            Brevo__SenderEmail=${{ secrets.BREVO_SENDER_EMAIL }}
            Brevo__SenderName=Portfolio Admin
            SeedAdmin__Username=${{ secrets.SEED_ADMIN_USERNAME }}
            SeedAdmin__Password=${{ secrets.SEED_ADMIN_PASSWORD }}
            SeedAdmin__Email=${{ secrets.SEED_ADMIN_EMAIL }}
            OpenSearch__Url=http://opensearch:9200
            Kafka__BootstrapServers=kafka:9092
            Kafka__OtpEmailTopic=send-otp-email
            Cors__AllowedOrigins__0=${{ secrets.CORS_ALLOWED_ORIGIN }}
            Loki__Url=http://loki:3100
            ENVEOF
            cd ~/portfolio
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export API_VERSION=${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d api

      # Deploy "succeeding" above just means the restart command ran without
      # erroring — it doesn't prove the new container actually came up
      # healthy. This is the health check we flagged as missing earlier.
      - name: Verify the deployment is healthy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deployer
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5229/health > /dev/null; then
                echo "Deployment healthy."
                exit 0
              fi
              sleep 2
            done
            echo "Deployment did not become healthy in time."
            exit 1
